<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face { font-family: Muller; src: url("../../../app/src/main/res/font/muller_regular.ttf"); font-weight: 400; }
    @font-face { font-family: Muller; src: url("../../../app/src/main/res/font/muller_bold.ttf"); font-weight: 700; }
    @font-face { font-family: Muller; src: url("../../../app/src/main/res/font/mullerblack.ttf"); font-weight: 900; }
    :root { --bg:#0b1d31; --surface:#132e4a; --container:#1b4163; --elevated:#28557e; --mint:#69e5be; --cyan:#00e5ff; --pink:#ffccff; --hot:#ff3f7b; --text:#f5f7fa; --muted:#c3d3df; --outline:#5a82a3; --nav:#102a44; --mini:#24587f; --error:#ff8a80; --monthly:#5fd9b4; --monthly-content:#0f253e; --one:#204971; }

    body { margin:0; background:#061422; color:var(--text); font-family:Muller,Arial,sans-serif; }
    #screens { display:flex; flex-wrap:wrap; gap:32px; align-items:flex-start; padding:32px; }
    .screen { width:390px; position:relative; overflow:hidden; background:var(--bg); isolation:isolate; box-shadow:0 18px 50px #0008; }
    .home{height:757px}.player{height:1022px}.collection{height:740px}.about{height:1418px}
    .title { position:absolute; left:16px; top:16px; margin:0; font-size:24px; line-height:32px; font-weight:900; color:var(--text); }
    .icon-btn { position:absolute; width:48px;height:48px; display:grid;place-items:center; color:var(--text); font-size:24px; }
    .account { right:16px;top:8px; } .account::before { content:""; position:absolute; width:40px;height:40px;border-radius:50%;background:var(--container);z-index:-1; }
    .dots { right:16px;top:8px; font-weight:900; letter-spacing:2px; }

    .streams { top:132px; height:198px; } .playlists { top:416px;height:160px; }
    .stream { width:316px;height:198px;flex:0 0 316px;border-radius:24px;overflow:hidden;background:var(--container);border:1px solid #000; }
    .stream svg{display:block;width:100%;height:100%}.playlist {width:160px;height:160px;flex:0 0 160px;border-radius:24px;overflow:hidden;background:var(--container)}.playlist img,.art img{width:100%;height:100%;object-fit:cover;display:block}
    .mini { position:absolute;left:16px;width:358px;height:74px;border-radius:15px;background:var(--mini);display:flex;align-items:center;box-shadow:0 6px 14px #0004; }
    .mini .art { margin-left:12px;width:48px;height:48px;border-radius:8px;overflow:hidden;background:var(--container) }.mini-copy{margin-left:12px;min-width:0}.mini-copy b{display:block;font-size:16px;line-height:20px;font-weight:400}.mini-copy span{display:block;margin-top:2px;font-size:14px;line-height:18px;color:var(--muted)}.mini .mini-action{margin-left:auto;width:48px;height:48px;display:grid;place-items:center;font-size:20px;color:var(--text)}
    .nav {position:absolute;left:0;bottom:0;width:390px;height:76px;border-radius:18px 18px 0 0;background:var(--nav);border-top:1px solid var(--outline);display:flex}.nav-item{width:97.5px;height:76px;position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:13px;color:var(--muted);font-size:12px;line-height:16px;font-weight:700}.nav-item .nav-icon{height:24px;font-size:21px;line-height:24px;z-index:1}.nav-item span:last-child{margin-top:8px;z-index:1}.nav-item.active{color:var(--mint)}.nav-item.active::before{content:"";position:absolute;top:8px;width:64px;height:48px;border-radius:24px;background:var(--pink)}.nav-item.active .nav-icon{color:var(--bg)}
    .now-playing{position:absolute;top:34px;width:100%;font-size:12px;line-height:16px;text-align:center;color:var(--muted)}.pager{position:absolute;top:64px;left:182px;display:flex;gap:2px}.pager i{width:8px;height:8px;border-radius:50%;background:#7893aa}.pager i:first-child{background:var(--mint)}
    .album{position:absolute;left:74px;top:94px;width:242px;height:242px;border-radius:24px;overflow:hidden;border:2px solid var(--outline);box-shadow:0 8px 22px #0007}.track-title{position:absolute;top:373px;left:16px;width:358px;text-align:center;font-size:24px;line-height:30px;font-weight:900}.track-artist{position:absolute;top:404px;left:16px;width:358px;text-align:center;font-size:18px;line-height:24px;color:var(--muted)}
    .controls{position:absolute;top:442px;left:16px;width:358px;height:80px;display:flex;align-items:center;justify-content:space-between}.reaction{width:48px;height:48px;display:grid;place-items:center;font-size:27px}.play-pause{width:80px;height:80px;border-radius:24px;display:grid;place-items:center;background:var(--mint);color:var(--bg);font-size:27px;font-weight:900}.hint{position:absolute;top:526px;width:100%;text-align:center;font-size:11px;color:var(--muted)}
    .history{position:absolute;left:16px;top:553px;width:358px;height:372px;padding:18px 16px;border-radius:20px;border:1px solid var(--outline);background:var(--elevated)}.history h2{margin:0;font-size:24px;line-height:30px;font-weight:900}.history-row{height:74px;display:flex;align-items:center;gap:8px}.history-row:first-of-type{margin-top:18px}.time{width:48px;font-size:13px;color:var(--muted)}.history-row .art{width:40px;height:40px;border-radius:8px;overflow:hidden}.history-copy{min-width:0}.history-copy b{display:block;font-size:16px;line-height:20px;font-weight:400}.history-copy span{font-size:13px;line-height:18px;color:var(--muted)}.wide-button{position:absolute;left:16px;bottom:16px;width:326px;height:54px;border:1px solid var(--outline);border-radius:12px;display:grid;place-items:center;color:var(--text);font-size:20px;background:var(--surface)}
    .description{position:absolute;left:16px;top:84px;color:var(--muted);font-size:14px;line-height:20px}.track-card{position:absolute;left:16px;width:358px;height:97px;background:var(--surface);border:1px solid var(--outline);border-radius:20px;display:flex;align-items:center;padding:16px;gap:12px}.track-card .art{width:64px;height:64px;border-radius:16px;overflow:hidden;flex:0 0 64px}.track-copy{width:178px}.track-copy b{font-size:16px;line-height:20px;font-weight:400;display:block}.track-copy span{font-size:13px;line-height:18px;color:var(--muted);display:block}.open{margin-left:auto;width:48px;height:48px;border-radius:50%;border:2px solid var(--mint);display:grid;place-items:center;color:var(--mint);font-size:24px}
    .empty-card{position:absolute;left:16px;top:133px;width:358px;height:358px;border:1px solid var(--outline);border-radius:24px;background:var(--surface)}.disc-outer,.disc-inner,.disc-center,.disc-hole{position:absolute;border-radius:50%}.disc-outer{left:109px;top:68px;width:140px;height:140px;background:#e3d3ff}.disc-inner{left:124px;top:83px;width:110px;height:110px;background:var(--pink)}.disc-center{left:152px;top:111px;width:54px;height:54px;background:#6e53a9}.disc-hole{left:172px;top:131px;width:14px;height:14px;background:var(--surface)}.empty-heart{position:absolute;top:155px;left:232px;font-size:40px;color:var(--hot)}.empty-title{position:absolute;top:238px;width:100%;text-align:center;font-size:16px;font-weight:700}.empty-copy{position:absolute;top:270px;width:100%;text-align:center;font-size:13px;line-height:20px;color:var(--muted)}
    .support{position:absolute;left:16px;width:358px;border-radius:24px;padding:24px}.support.monthly{top:80px;height:286px;background:var(--monthly);color:var(--monthly-content)}.support.one{top:382px;height:266px;background:var(--one);color:var(--text)}.chip{display:inline-grid;place-items:center;height:28px;padding:0 14px;border-radius:14px;background:var(--surface);color:var(--text);font-size:11px}.monthly .chip{background:#f5f7fa;color:var(--monthly-content)}.support h2{font-size:24px;line-height:30px;font-weight:400;margin:16px 0 8px}.support p{font-size:14px;line-height:20px;margin:0}.support .button{position:absolute;left:24px;bottom:24px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:20px}.monthly .button{width:184px;background:var(--monthly-content);color:var(--monthly)}.one .button{width:239px;background:#0f253e;color:var(--text)}
    .about-card{position:absolute;left:16px;top:695px;width:358px;height:276px;border-radius:24px;border:1px solid var(--outline);background:var(--surface);padding:36px 32px}.about-card h2{margin:0 0 22px;font-size:26px;line-height:32px;font-weight:900}.about-card p{font-size:16px;line-height:24px;color:var(--muted);margin:0}.about-card .button{position:absolute;left:32px;bottom:32px;width:294px;height:54px;border:1px solid var(--outline);border-radius:12px;display:grid;place-items:center;font-size:20px}.social-title{position:absolute;left:16px;top:1025px;margin:0;font-size:24px;line-height:30px;font-weight:900}.social-grid{position:absolute;left:16px;top:1067px;display:grid;grid-template-columns:repeat(4,76px);gap:16px 14px}.social{width:76px;height:76px;border-radius:12px;border:1px solid var(--outline);background:var(--surface);padding:12px}.social img{width:100%;height:100%;object-fit:contain}
    .scrim{position:absolute;inset:0;background:#0b1d31c9;z-index:10}.popup{position:absolute;right:16px;top:72px;width:206px;border-radius:20px;padding:8px 11px;background:var(--elevated);border:1px solid var(--outline);z-index:11}.popup-row{height:48px;display:flex;align-items:center;gap:10px;font-size:14px}.popup-row i{width:48px;display:grid;place-items:center;font-style:normal;color:var(--muted)}.popup-row.danger{color:var(--error)}.popup-row.danger i{color:var(--error)}
    .sheet{position:absolute;left:16px;width:358px;border-radius:28px;background:var(--surface);border:1px solid var(--outline);z-index:11;padding:0 0 18px}.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--outline);margin:16px auto 16px}.sheet h2{margin:0 24px 18px;font-size:22px;line-height:28px;font-weight:900}.sheet-row{height:56px;padding:0 16px;display:flex;align-items:center;gap:12px;font-size:16px}.sheet-row i{width:48px;height:48px;display:grid;place-items:center;font-style:normal;color:var(--mint);font-size:20px}.sheet-row.selected{box-shadow:inset 4px 0 var(--mint)}.message-box{height:126px;margin:0 24px 20px;border-radius:16px;border:1px solid var(--outline);background:var(--container);padding:16px;color:var(--muted);font-size:16px}.send{height:52px;margin:0 24px;border-radius:12px;display:grid;place-items:center;background:var(--mint);color:var(--bg);font-size:20px}.error-note{margin:14px 24px 0;font-size:11px;color:var(--error)}.full-history{position:absolute;left:40px;top:90px;width:310px;height:842px;border:2px solid var(--outline);border-radius:40px;background:var(--elevated);z-index:11;padding:24px 16px}.full-history h2{font-size:20px;letter-spacing:1px;text-align:center;margin:0 0 16px}.full-history hr{border:0;border-top:1px solid var(--outline);margin:0}.full-history .history-row{height:82px}.close{position:absolute;right:24px;top:34px;z-index:12;width:48px;height:48px;border-radius:50%;background:var(--elevated);display:grid;place-items:center;font-size:24px}
    #kit{width:1800px;min-height:3020px;margin:0 32px 32px;background:var(--bg);border:1px solid var(--outline);border-radius:24px;padding:24px 32px;color:var(--text)}#kit h1{font-size:28px;margin:0}#kit>p{margin:4px 0 18px;color:var(--muted);font-size:14px}.kit-grid{display:grid;grid-template-columns:840px 864px;gap:16px 32px}.kit-section{border:1px solid var(--outline);border-radius:20px;background:var(--surface);padding:16px;min-height:210px;overflow:hidden}.kit-section h2{font-size:18px;margin:0 0 16px}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.swatch{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}.swatch b{width:28px;height:28px;border-radius:8px;display:block}.type-sample{margin:6px 0}.type-sample.black{font-weight:900;font-size:24px}.type-sample.section{font-weight:900;font-size:20px}.type-sample.body{font-size:16px}.type-sample.secondary{font-size:14px;color:var(--muted)}.rulers{display:flex;gap:24px;align-items:flex-start}.ruler i{display:block;height:12px;background:var(--mint);border-radius:6px;margin-bottom:6px}.nav-sample,.mini-sample,.card-sample,.button-sample,.state-sample{position:relative;transform-origin:top left}.nav-sample{width:390px;height:76px}.mini-sample{width:358px;height:74px}.card-sample{width:358px;height:97px}.button-row{display:flex;gap:12px;flex-wrap:wrap}.button-demo{width:184px;height:52px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--mint);color:var(--bg)}.button-demo.pressed{background:var(--cyan)}.button-demo.disabled{background:#1e3754;color:#6f899f}.button-demo.loading{background:var(--mint);color:var(--bg)}.button-demo.error{background:var(--error);color:var(--bg)}.menu-demo{width:206px;border:1px solid var(--outline);border-radius:20px;background:var(--elevated);padding:8px}.sheet-demo{width:358px;border:1px solid var(--outline);border-radius:28px;background:var(--surface);padding:16px}.states-wrap{display:flex;gap:16px;flex-wrap:wrap}.note{font-size:11px;color:var(--muted)}
  </style>
</head>
<body>
  <div id="screens"></div>
  <div id="kit"></div>
  <script>
    const A = "../assets/";
    const art = { player:A+"real-artwork/player-what-you-know.png", p1:A+"real-artwork/playlist-seasonal-topping.png", p2:A+"real-artwork/playlist-xtra.png", homewrecker:A+"real-artwork/track-homewrecker.png", leila:A+"real-artwork/track-leila.png", forever:A+"real-artwork/track-forever.png" };
    const icons = { home:"⌂", player:"▷", collection:"♫", about:"ⓘ", account:"♙", up:"♧", down:"♤", pause:"Ⅱ", play:"▶", menu:"⋮", open:"↗", search:"⌕", timer:"◴", warning:"⚠", browser:"□", close:"×", disc:"◉" };
    const tracks = [["HOMEWRECKER","SOMBЯ",art.homewrecker],["LEILA","MIAMI HORROR FT. POOLSIDE",art.leila],["FOREVER","CHVRCHES",art.forever]];
    const history = [["10:45","CRYOGEN","MUSE",art.homewrecker],["10:41","MEET ME IN LOVE","BLOSSOMS",art.leila],["10:36","CITY WALLS","TWENTY ONE PILOTS",art.forever],["10:32","THE LESS I KNOW","TAME IMPALA",art.player],["10:28","DREAMS","THE CRANBERRIES",art.player]];
    const escape = (v) => String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    function attr(node,n){return node.getAttribute(n)||node.getAttribute("android:"+n)||""}
    function color(v){if(!v||v==="#00000000")return["none",1];let r=v.replace("#","");return r.length===8?["#"+r.slice(2),parseInt(r.slice(0,2),16)/255]:["#"+r,1]}
    function toSvg(xml){const doc=new DOMParser().parseFromString(xml,"application/xml"),root=doc.documentElement;const walk=(node)=>{const tag=node.tagName.toLowerCase();if(tag==="path"){const [fill,fo]=color(attr(node,"fillColor")),[stroke,so]=color(attr(node,"strokeColor"));return `<path d="${escape(attr(node,"pathData"))}" fill="${fill}" fill-opacity="${fo}" stroke="${stroke}" stroke-opacity="${so}" stroke-width="${attr(node,"strokeWidth")||0}"/>`}const c=[...node.children].map(walk).join("");if(tag==="group"){const tx=attr(node,"translateX")||0,ty=attr(node,"translateY")||0;return `<g transform="translate(${tx} ${ty})">${c}</g>`}return c};return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${attr(root,"viewportWidth")} ${attr(root,"viewportHeight")}">${[...root.children].map(walk).join("")}</svg>`}
    async function banners(){for(const n of ["myata","gold","xtra"]){const xml=await fetch(A+n+"_banner_new.xml").then(r=>r.text());document.querySelectorAll(`[data-banner="${n}"]`).forEach(el=>el.innerHTML=toSvg(xml))}}
    function nav(active){return `<div class="nav">${[["home","Главная"],["player","Плеер"],["collection","Коллекция"],["about","О нас"]].map(x=>`<div class="nav-item ${x[0]===active?"active":""}"><span class="nav-icon">${icons[x[0]]}</span><span>${x[1]}</span></div>`).join("")}</div>`}
    function mini(state="play",top){return `<div class="mini" style="top:${top}px"><div class="art"><img src="${art.player}"></div><div class="mini-copy"><b>WHAT YOU KNOW</b><span>TWO DOOR CINEMA CLUB</span></div><div class="mini-action">${state==="buffering"?"•••":icons[state]}</div></div>`}
    function head(title,kind="account"){return `<h1 class="title">${title}</h1><div class="icon-btn ${kind}">${kind==="account"?icons.account:icons.menu}</div>`}
    function stream(name){return `<div class="stream" data-banner="${name}"></div>`}
    function historyRows(count=3,compact=false){return history.slice(0,count).map(r=>`<div class="history-row"><span class="time">${r[0]}</span><div class="art"><img src="${r[3]}"></div><div class="history-copy"><b>${r[1]}</b><span>${r[2]}</span></div></div>`).join("")}
    function playerBase(){return `<div class="now-playing">СЕЙЧАС ИГРАЕТ</div><div class="pager"><i></i><i></i><i></i></div><div class="album"><img src="${art.player}"></div><div class="track-title">WHAT YOU KNOW</div><div class="track-artist">TWO DOOR CINEMA CLUB</div><div class="controls"><div class="reaction">${icons.up}</div><div class="play-pause">${icons.pause}</div><div class="reaction" style="color:var(--muted)">${icons.down}</div></div><div class="hint">${"Сохранить в Коллекцию"} · Отрицательная реакция</div><div class="history"><h2>История эфира</h2>${historyRows(3)}<div class="wide-button">Показать ещё</div></div>${nav("player")}`}
    function trackCards(){return tracks.map((t,i)=>`<div class="track-card" style="top:${133+i*114}px"><div class="art"><img src="${t[2]}"></div><div class="track-copy"><b>${t[0]}</b><span>${t[1]}</span></div><div class="open">${icons.open}</div></div>`).join("")}
    function home(){return `<section class="screen home" data-name="home">${head("Привет, Денис!")}<h2 class="section-title" style="top:80px">Наши потоки</h2><div class="scroll-x streams">${stream("myata")}${stream("gold")}</div><h2 class="section-title" style="top:369px">Мятные плейлисты</h2><div class="scroll-x playlists"><div class="playlist"><img src="${art.p1}"></div><div class="playlist"><img src="${art.p2}"></div><div class="playlist"><img src="${art.player}"></div></div>${mini("play",602)}${nav("home")}</section>`}
    function player(name="player"){return `<section class="screen player" data-name="${name}">${playerBase()}</section>`}
    function collection(name="collection",empty=false){if(empty)return `<section class="screen collection" data-name="${name}">${head("Моя коллекция")}<div class="description">Здесь хранятся ваши сохранённые треки</div><div class="empty-card"><div class="disc-outer"></div><div class="disc-inner"></div><div class="disc-center"></div><div class="disc-hole"></div><div class="empty-heart">♥</div><div class="empty-title">Здесь пока пусто</div><div class="empty-copy">Сохраняйте понравившиеся треки<br>в плеере, и они появятся здесь.</div></div>${mini("play",587)}${nav("collection")}</section>`;return `<section class="screen collection" data-name="${name}">${head("Моя коллекция","dots")}<div class="description">Здесь хранятся ваши сохранённые треки</div>${trackCards()}${mini("pause",587)}${nav("collection")}</section>`}
    function about(){const logos=["telegram_info.png","spotify_info.png","insta_info.png","tiktok_info.png","youtube_info.png","twitter_info.png","vk_info.png","yandex_info.png"];return `<section class="screen about" data-name="about">${head("Поддержать радио")}<div class="support monthly"><span class="chip">Ежемесячно</span><h2>Подпишитесь на Boosty</h2><p>Полный архив эфиров и подкастов,<br>эксклюзивные плейлисты и ранний доступ<br>к новому контенту. Плюс — ваше имя появится<br>в титрах наших видеороликов на YouTube.</p><div class="button">Подписаться</div></div><div class="support one"><span class="chip">Разово</span><h2>Помочь эфиру звучать</h2><p>Разовый вклад помогает оплачивать серверы,<br>приложение и развитие Радио Мята.<br>Любая сумма поддерживает станцию на плаву.</p><div class="button">Поддержать эфир</div></div><div class="about-card"><h2>О нас</h2><p>Радио Мята — интернет-радиостанция,<br>ориентированная на инди-музыку и<br>альтернативный рок.</p><div class="button">Читать подробнее</div></div><h2 class="social-title">Ещё Радио Мята</h2><div class="social-grid">${logos.map(l=>`<div class="social"><img src="${A+l}"></div>`).join("")}</div>${mini("play",1262)}${nav("about")}</section>`}
    function popup(rows){return `<div class="scrim"></div><div class="popup">${rows.map(r=>`<div class="popup-row ${r[2]?"danger":""}"><i>${icons[r[1]]}</i><span>${r[0]}</span></div>`).join("")}</div>`}
    function sheet(title,rows,top,extra=""){return `<div class="scrim"></div><div class="sheet" style="top:${top}px"><div class="handle"></div><h2>${title}</h2>${extra||rows.map((r,i)=>`<div class="sheet-row ${r[2]?"selected":""}"><i>${icons[r[1]]}</i><span>${r[0]}</span></div>`).join("")}</div>`}
    function element(html){const template=document.createElement("template");template.innerHTML=html.trim();return template.content.firstElementChild}

    function kit(){const tokenNames=["background","surface","surfaceContainer","surfaceElevated","primary","secondary","activeIndicator","miniPlayer","textPrimary","textSecondary","supportMonthlyBackground","supportOneTimeBackground","error"];const colors={background:"#0b1d31",surface:"#132e4a",surfaceContainer:"#1b4163",surfaceElevated:"#28557e",primary:"#69e5be",secondary:"#00e5ff",activeIndicator:"#ffccff",miniPlayer:"#24587f",textPrimary:"#f5f7fa",textSecondary:"#c3d3df",supportMonthlyBackground:"#5fd9b4",supportOneTimeBackground:"#204971",error:"#ff8a80"};document.querySelector("#kit").innerHTML=`<h1>Radio Myata · Dark UI KIT</h1><p>Variables: Light/Dark · Muller · 48×48dp minimum touch target</p><div class="kit-grid"><section class="kit-section"><h2>Colors</h2><div class="swatches">${tokenNames.map(t=>`<div class="swatch"><b style="background:${colors[t]}"></b>${t}</div>`).join("")}</div></section><section class="kit-section"><h2>Typography</h2><div class="type-sample black">Screen title · Muller Black 24/32</div><div class="type-sample section">Section title · Muller Black 20/26</div><div class="type-sample body">Body · Muller Regular 16/24</div><div class="type-sample secondary">Secondary · Muller Regular 14/20</div></section><section class="kit-section"><h2>Spacing</h2><div class="rulers">${[4,8,12,16,20,24,32,40,48].map(n=>`<div><i style="width:${n}px"></i><span class="note">${n}</span></div>`).join("")}</div><p class="note">Radii: 15 · 20 · 24 · 28 · 40</p></section><section class="kit-section"><h2>Navigation</h2><div class="nav nav-sample">${nav("home").replace(/^<div class="nav">|<\\/div>$/g,"")}</div><p class="note">Component variants: State=Active / State=Inactive</p></section><section class="kit-section"><h2>Playback</h2><div class="mini mini-sample" style="position:relative;left:0;top:0"><div class="art"><img src="${art.player}"></div><div class="mini-copy"><b>WHAT YOU KNOW</b><span>TWO DOOR CINEMA CLUB</span></div><div class="mini-action">Ⅱ</div></div><p class="note">Component variants: Play / Pause / Buffering · Player controls: save to Collection / negative reaction</p></section><section class="kit-section"><h2>Cards</h2><div class="card-sample track-card" style="position:relative;left:0;top:0">${trackCards().replace(/<div class="track-card"[^>]*>|<\\/div>$/g,"")}</div><p class="note">Stream, playlist, track, history, monthly support and one-time support cards.</p></section><section class="kit-section"><h2>Buttons</h2><div class="button-row"><div class="button-demo">Default</div><div class="button-demo pressed">Pressed</div><div class="button-demo disabled">Disabled</div><div class="button-demo loading">•••</div><div class="button-demo error">Удалить</div></div></section><section class="kit-section"><h2>Menus</h2><div class="menu-demo"><div class="popup-row"><i>⌕</i>Найти трек</div><div class="popup-row"><i>◴</i>Таймер сна</div><div class="popup-row danger"><i>⚠</i>Сообщить о проблеме</div></div></section><section class="kit-section"><h2>Bottom Sheets</h2><div class="sheet-demo"><div class="handle"></div><b>Найти трек в музыкальном сервисе</b><div class="sheet-row"><i>◉</i>Spotify</div><div class="sheet-row"><i>□</i>Найти в браузере</div></div></section><section class="kit-section"><h2>States</h2><div class="states-wrap"><div class="button-demo">Default</div><div class="button-demo disabled">Disabled</div><div class="button-demo error">Error</div></div><p class="note">Loading, empty, disabled and error. Saved track uses mint/pink, never error.</p></section></div>`}

></section><section class="kit-section"><h2>Playback</h2><div class="mini" style="position:relative;left:0;top:0"><div class="art"><img src="${art.player}"></div><div class="mini-copy"><b>WHAT YOU KNOW</b><span>TWO DOOR CINEMA CLUB</span></div><div class="mini-action">Ⅱ</div></div><p class="note">Variants: Play / Pause / Buffering · thumbs up saves to Collection; thumbs down is a negative reaction.</p></section><section class="kit-section"><h2>Cards</h2><div class="track-card" style="position:relative;left:0;top:0"><div class="art"><img src="${art.homewrecker}"></div><div class="track-copy"><b>HOMEWRECKER</b><span>SOMBЯ</span></div><div class="open">↗</div></div><p class="note">Stream, playlist, track, history and support cards.</p></section><section class="kit-section"><h2>Buttons</h2><div class="button-row"><div class="button-demo">Default</div><div class="button-demo pressed">Pressed</div><div class="button-demo disabled">Disabled</div><div class="button-demo loading">•••</div><div class="button-demo error">Удалить</div></div></section><section class="kit-section"><h2>Menus</h2><div class="menu-demo"><div class="popup-row"><i>⌕</i>Найти трек</div><div class="popup-row"><i>◴</i>Таймер сна</div><div class="popup-row danger"><i>⚠</i>Сообщить о проблеме</div></div></section><section class="kit-section"><h2>Bottom Sheets</h2><div class="sheet-demo"><div class="handle"></div><b>Найти трек в музыкальном сервисе</b><div class="sheet-row"><i>◉</i>Spotify</div><div class="sheet-row"><i>□</i>Найти в браузере</div></div></section><section class="kit-section"><h2>States</h2><div class="states-wrap"><div class="button-demo">Default</div><div class="button-demo disabled">Disabled</div><div class="button-demo error">Error</div></div><p class="note">Loading, empty, disabled, error. Saved uses mint/pink, never error.</p></section></div>`}
