name: Android CI

# Debug-only checks for pull requests. No signing, no secrets, no release
# artifacts: release tasks are refused by the signing guard when
# keystore.properties is absent (see docs/RELEASE_SIGNING.md), which is exactly
# the state a clean clone is in.
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests, lint, debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Also caches the Gradle distribution and the dependency cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Debug build
        run: ./gradlew assembleDebug --stacktrace

      # Reports are what makes a red build actionable.
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
