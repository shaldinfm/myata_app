plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

// Release signing is read from an untracked keystore.properties in the project root.
// The file is intentionally NOT in git — see docs/RELEASE_SIGNING.md.
// Debug builds do not need it.
// Supabase client configuration. Untracked, like keystore.properties, and unlike it
// this file holds nothing secret: the project URL and the *publishable* key are
// meant to be public and ship in the APK. A secret key must never appear here -
// see docs/SUPABASE-FOUNDATION.md.
//
// Absent or empty is a supported state: the app then has no Supabase at all and
// behaves exactly as it did before this existed, which is what keeps CI and any
// fresh clone building.
def supabasePropsFile = rootProject.file('supabase.properties')
def supabaseProps = new Properties()
if (supabasePropsFile.exists()) {
    supabasePropsFile.withInputStream { supabaseProps.load(it) }
}
def supabaseUrl = (supabaseProps['SUPABASE_URL'] ?: '').trim()
def supabaseKey = (supabaseProps['SUPABASE_PUBLISHABLE_KEY'] ?: '').trim()

// A secret key in the client is the one mistake that cannot be walked back: it
// bypasses every RLS policy and would be readable in the APK. Fail the build.
if (supabaseKey.startsWith('sb_secret_') || supabaseKey.startsWith('service_role')) {
    throw new GradleException(
            'supabase.properties holds a SECRET key. Only the publishable key ' +
            '(sb_publishable_...) may ship in an app. Remove it and rotate that key now.')
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Why release signing cannot be used, or null when it can. Checking the keystore
// itself — not just that keystore.properties exists — keeps a half-filled config
// from failing later inside validateSigningRelease.
// This message is user-facing: name the key at fault, never its value.
def releaseSigningProblem = {
    if (!keystorePropsFile.exists()) {
        return 'keystore.properties not found in the project root'
    }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll {
        !keystoreProps[it]?.trim()
    }
    if (!missing.isEmpty()) {
        return "keystore.properties has no value for: ${missing.join(', ')}"
    }
    if (!rootProject.file(keystoreProps['storeFile']).isFile()) {
        return 'the keystore that storeFile points to does not exist at that path ' +
                '(java.util.Properties drops single backslashes, so use forward slashes)'
    }
    return null
}()
def releaseSigningAvailable = releaseSigningProblem == null

android {
    compileSdk 36
    namespace 'com.example.musicplayerapp'

    defaultConfig {
        applicationId "dlinemedia.radioplayer.myata"
        // 24, not 21: Android 5/6 cannot reach our own servers (see the commit
        // that raised this) and network_security_config only applies from 24.
        minSdk 24
        targetSdk 36
        versionCode 202611
        versionName "3.6.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", "\"${supabaseKey}\""
    }

    buildFeatures{
        viewBinding = true
        buildConfig = true
    }

    sourceSets {
        // So MigrationTestHelper can read the exported schemas off the device.
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    dataBinding{
        enabled = true
    }

    signingConfigs {
        if (releaseSigningAvailable) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
            // Without a signing config the build is stopped by the guard below,
            // before any task that could write an artifact gets to run.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Required by supabase-kt, whose documented minimum is API 26; this is how
        // it runs on our minSdk 24. It back-ports java.time and the other newer
        // java.* APIs Ktor and kotlinx-datetime reach for, and without it those
        // calls are a runtime NoClassDefFoundError on 24 and 25 rather than a
        // build error - see docs/SUPABASE-FOUNDATION.md.
        coreLibraryDesugaringEnabled true
    }
    testOptions {
        unitTests {
            // Media3's PlaybackException touches android.os stubs when constructed.
            // Without this the stubs throw and the pure-logic tests cannot run.
            returnDefaultValues = true
        }
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// The exported Room schema is what MigrationTestHelper builds a real v1 database
// from, and what makes a schema change visible in review instead of silent.
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

// Release signing guard (issue #10).
//
// The previous version hung a doFirst on the bundleRelease *lifecycle* task.
// bundleRelease produces nothing itself: its dependency packageReleaseBundle
// writes the bundle and runs to completion first, so a build without a signing
// config still left an unsigned app-release.aab in app/build/outputs before
// failing. The check therefore has to happen before execution starts at all.
//
// Failing from taskGraph.whenReady does that: the graph is fully resolved and
// no task has run yet, so nothing is ever written to outputs/.
if (!releaseSigningAvailable) {
    def needsReleaseSigning = { String name ->
        name ==~ /^(assemble|bundle|install|package|validateSigning)Release(Bundle|UniversalApk)?$/
    }

    gradle.taskGraph.whenReady { graph ->
        def blocked = graph.allTasks
                .findAll { it.project == project && needsReleaseSigning(it.name) }
                .collect { it.name }
                .sort()
        if (!blocked.isEmpty()) {
            throw new GradleException(
                    "Release signing unavailable: ${releaseSigningProblem}.\n" +
                    "Refusing to run: ${blocked.join(', ')}.\n" +
                    'Copy keystore.properties.example to keystore.properties and fill it in ' +
                    'locally, then see docs/RELEASE_SIGNING.md.\n' +
                    'This build produced no artifact. Anything currently in ' +
                    'app/build/outputs/ is left over from an earlier run and is NOT a ' +
                    'result of this build.')
        }
    }
}

dependencies {

    // 1.3.0 predates the Android 14+/15 foreground-service and MediaSession
    // changes; 1.7.1 is the current line validated against API 36.
    def exoplayerVersion = '1.7.1'
    def retrofitVersion = '2.9.0'
    // 2.7.x is the first Room line built for KSP2 / Kotlin 2.2. Schema is unchanged.
    def room_version = '2.7.2'
    // NOT the newest supabase-kt. 3.7.0 is built with Kotlin 2.4 and publishes
    // metadata this project's Kotlin 2.2.21 compiler cannot read - it fails the
    // build outright, and it would also pull kotlin-stdlib 2.4 onto the classpath
    // of every module. 3.2.6 is the last line built with exactly our Kotlin, so
    // there is no metadata gap and no stdlib upgrade smuggled in behind one.
    // Moving up means moving the whole project's Kotlin first; see
    // docs/SUPABASE-FOUNDATION.md.
    def supabaseVersion = '3.2.6'

    // The engine version is not a free choice: it has to equal the
    // ktor-client-core that supabase-kt itself drags in, or the app runs one
    // Ktor engine against a different Ktor core. supabase-kt 3.2.6 declares
    // ktor-client-core 3.3.1 in its own POM - checked, not assumed - and the
    // resolved runtime classpath agrees. 3.3.1 IS the aligned version here, and
    // pinning the engine to 3.3.0 would create exactly the split that aligning
    // is meant to avoid.
    def ktorVersion = '3.3.1'
    def desugarVersion = '2.1.5'

    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation("androidx.viewpager2:viewpager2:1.0.0")
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'jp.wasabeef:picasso-transformations:2.4.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // 2.8.x is the first Navigation line that supports predictive back, which
    // Android 16 turns on for targetSdk 36 regardless of the manifest opt-out.
    implementation("androidx.navigation:navigation-fragment-ktx:2.8.9")
    implementation("androidx.navigation:navigation-ui-ktx:2.8.9")

    implementation 'androidx.core:core-ktx:1.13.1'
    // The Android 12 splash screen, back-ported. One theme then drives both the
    // platform SplashScreen on 31+ and an equivalent starting window on 24-30,
    // which is what removes the launch dead time on every supported API level.
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    
    // Room Database
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    
    // SwipeRefreshLayout
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    
    // Lifecycle
    // Required by Navigation 2.8.x.
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.7"
    
    // Media3 migration
    implementation "androidx.media3:media3-exoplayer:$exoplayerVersion"
    implementation "androidx.media3:media3-exoplayer-dash:$exoplayerVersion"
    implementation "androidx.media3:media3-ui:$exoplayerVersion"
    implementation "androidx.media3:media3-session:$exoplayerVersion"
    implementation "androidx.media3:media3-datasource-okhttp:$exoplayerVersion"
    
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    
    // Supabase: Auth and PostgREST only. No realtime, storage or functions - this
    // app has no use for them and each is more to ship and to keep current.
    //
    // The Ktor engine is OkHttp, and it is handed the app's own shared client, so
    // every Supabase request goes through the same connection pool, timeouts and -
    // the part that matters on API 24 - the same network_security_config with its
    // bundled roots. A second HTTP stack with its own TLS would be a second thing
    // to get right on old devices.
    implementation platform("io.github.jan-tennert.supabase:bom:$supabaseVersion")
    implementation 'io.github.jan-tennert.supabase:auth-kt'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
    implementation "io.ktor:ktor-client-okhttp:$ktorVersion"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugarVersion"

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
}