plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    compileSdk 35
    namespace 'com.example.musicplayerapp'

    defaultConfig {
        applicationId "dlinemedia.radioplayer.myata"
        minSdk 21
        targetSdk 35
        versionCode 202567
        versionName "3.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures{
        viewBinding = true
    }

    dataBinding{
        enabled = true
    }

    signingConfigs {
        release {
            storeFile file("D:\\Мята\\Ш_Приложение\\DLineMedia.jks")
            storePassword "erty3489GoroDL00"
            keyAlias "dline_media"
            keyPassword "erty3489GoroDL00"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
